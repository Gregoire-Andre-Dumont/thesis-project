detection_data:
  _target_: src.typing.detection_data.DetectionData
  amodal_directory: data/person_path/amodal
  visible_directory: data/person_path/visible
  video_directory: data/person_path/videos
  load_frames: True
  num_threads: 32

person_path:
  _target_: src.typing.person_path.PersonPath
  main_directory: data/person_path
  occlusion_ranges: [5, 150]
  n_experiments: 1200
  n_after_occlusion: 50
  random_seed: 44
  min_visible_ratio: 0.7
  resize_resolution: 1024
  min_visible_area: 600
  max_visible_area: null
  max_distractor_overlap: 0.30
  min_distractor_overlap: 0.00
  non_targets: [crowd, person_in_vehicle, reflection, person_in_background, severly_occluded_person]

# experiment parameters
n_traj: 25
stride: 2
crop_size: 512
max_frames: 250
k_distractors: 3
label_iou_threshold: 0.2
share_image_cache: false
encoders: [perception, hiera_sam]
alphas: [0.0, 0.25, 0.5, 0.75, 1.0]
memory_sizes: [1, 2, 4, 8, 16]

# the two memory-gating policies (both run as real SAM 2 rollouts)
oracle_config: conf/trackers/baselines/memory_oracle.yaml   
baseline_config: conf/trackers/baselines/sam_baseline.yaml   
out_dir: data/covariate_shift 
checkpoint_every: 3
plot_every: 2
