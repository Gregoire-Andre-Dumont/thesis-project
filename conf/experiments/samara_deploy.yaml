# @package _global_
defaults:
  - /offline_trainers: cnn_fixed_samara
  - /offline_trainers@gate_trainers: cnn_gate_samara
  - /trackers@tracker: samara_controller

detection_data:
  _target_: src.typing.detection_data.DetectionData
  amodal_directory: data/person_path/amodal
  visible_directory: data/person_path/visible
  video_directory: data/person_path/videos
  load_frames: True
  num_threads: 32

person_path:
  _target_: src.typing.person_path.PersonPath
  main_directory: data/person_path
  n_experiments: 1200
  random_seed: 44
  first_occ_min: 8
  border_inset: 8
  n_after_occlusion: 30
  min_visible_area: 900
  min_visible_ratio: 0.90
  occlusion_ranges: [2, 50]
  max_distractor_overlap: 0.6
  non_targets: [crowd, person_in_vehicle, reflection, person_in_background, severly_occluded_person, sitting_person, person_on_open_vehicle]

# deployment parameters
n_traj: 60          # clips to deploy on; these trajectories are removed from calibrator training
max_frames: 300
coverage_threshold: 0.5   # box IoU a visible post-occlusion frame must clear to count, as in claim_1/claim_2
out_dir: data/samara_deploy
baseline_config: conf/trackers/baselines/sam_baseline.yaml   # the same SAM arm claim_1 and claim_2 score
separate_gate: False      # True trains `gate_trainers` as a second model owning the commit gate
