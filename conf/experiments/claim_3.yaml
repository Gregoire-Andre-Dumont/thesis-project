# @package _global_
detection_data:
  _target_: src.typing.detection_data.DetectionData
  amodal_directory: data/person_path/amodal
  visible_directory: data/person_path/visible
  video_directory: data/person_path/videos
  load_frames: True
  num_threads: 32

person_path:
  _target_: src.typing.person_path.PersonPath
  main_directory: data/person_path
  occlusion_ranges: [4, 75]
  n_experiments: 10200
  n_after_occlusion: 30
  first_occ_min: 5
  random_seed: 44
  min_visible_ratio: 0.75       # anchor at most 25% occluded (visible/amodal box area)
  min_visible_area: 900
  max_distractor_overlap: 0.5
  border_inset: 8               # and WHOLE in frame -- the ratio gate cannot see edge truncation
  non_targets: [crowd, person_in_vehicle, reflection, person_in_background, severly_occluded_person]

# experiment parameters
n_traj: 400
gate: sam
gate_thresholds: [0.5]
pe_select: true
encoder: perception           # pe_spatial_large_448 -- matched to the sam_large tracker
max_frames: 300
pe_config: conf/trackers/baselines/pe_tracker.yaml
out_dir: data/claim_3
