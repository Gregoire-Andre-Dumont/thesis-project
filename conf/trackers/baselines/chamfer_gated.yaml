tracker:
  _target_: src.modules.baselines.chamfer_gated.ChamferGatedBaseline
  iou_threshold: 0.2                # inherited SAMBaseline field; unused by the chamfer gate
  crop_size: 512                    # anchor-scale crop for the encoder, overridden per cell by the script
  model:
    _target_: src.modules.samara_hiera_model.SamaraHieraModel
    sam_model_path: tm/sam_base_plus.pt
    crop_resize: 512
    pad_ratio: 1.0
  main_memory:
    _target_: src.modules.memories.main_memory.MainMemory
    max_memory_history: 6           # reset per cell to the cell's memory size in prepare()
    max_pointer_history: 15

experiment:
  _target_: src.experiments.tracking_experiment.TrackingExperiment
  resolution: 1024
  experiment_name: chamfer_gated
  video_path: data/visualize/chamfer_gated
