tracker:
  _target_: src.modules.baselines.pe_tracker.PETracker
  pe_threshold: 0.03          # unused while gate=sam; kept for the PE-gated variant
  subtract_background: true   # score the FG-BG MARGIN, not foreground similarity alone
  bidirectional: false        # unidirectional chamfer: candidate -> reference only
  reference_history: 30       # anchor + last 30 committed foregrounds, scores averaged over all of them
  crop_size: 448              # pe_spatial_LARGE is a 448 / patch14 model -> 32x32 tokens (base is 512/patch16)
  pad_ratio: 0.2              # same crop padding every PE experiment in this repo uses
  model:
    _target_: src.modules.samara_model.SamaraModel
    sam_model_path: tm/sam_large.pt
    crop_resize: 384
    pad_ratio: 1.0

  main_memory:
    _target_: src.modules.memories.main_memory.MainMemory
    max_memory_history: 6
    max_pointer_history: 6
