tracker:
  _target_: src.modules.baselines.sam2.Sam2
  # No gate: stock SAM 2 commits every frame, so no threshold applies.
  model:
    _target_: src.modules.samara_model.SamaraModel
    sam_model_path: tm/sam_large.pt
    crop_resize: 384
    pad_ratio: 1.0
    
  main_memory:
    _target_: src.modules.memories.main_memory.MainMemory
    max_memory_history: 6
    max_pointer_history: 6

experiment:
  _target_: src.experiments.tracking_experiment.TrackingExperiment
  resolution: 1024
  experiment_name: sam2
  video_path: data/visualize/sam2
