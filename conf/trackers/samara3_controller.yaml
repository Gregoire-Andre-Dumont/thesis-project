tracker:
  _target_: src.modules.samara3_controller.Samara3Controller
  commit_threshold: 0.5
  gate: True
  model:
    _target_: src.modules.samara3_model.SamaraModel3
    # The FULL official SAM 3 checkpoint. The muggled builder reads the detector tensors to infer sizings
    # even though the stripped `sam_3/` never builds the detector, so a tracker-only slice will not load.
    sam_model_path: tm/sam3.pt
    crop_resize: 448
    pad_ratio: 0.25
    feature_encoder: perception
    max_side_length: 1008
  main_memory:
    _target_: src.modules.memories.main_memory_v3.MainMemoryV3
    max_memory_history: 6
    max_pointer_history: 6

experiment:
  _target_: src.experiments.tracking_experiment.TrackingExperiment
  resolution: 1008
  experiment_name: samara3_controller
  video_path: data/visualize/samara3_controller
