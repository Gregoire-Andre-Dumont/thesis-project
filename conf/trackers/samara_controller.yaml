tracker:
  _target_: src.modules.samara_controller.SamaraController
  commit_threshold: 0.5   # a PROBABILITY from the gate head, so 0.5 is the natural boundary
  select: False           # SAM's IoU token picks the mask -- every measured selection arm lost to gate-only
  gate: True              # the calibrator's commit decision, the intervention being measured
  model:
    _target_: src.modules.samara_model.SamaraModel
    sam_model_path: tm/sam_large.pt
    crop_resize: 448
    pad_ratio: 0.25
    feature_encoder: perception
  main_memory:
    _target_: src.modules.memories.main_memory.MainMemory
    max_memory_history: 6
    max_pointer_history: 6

experiment:
  _target_: src.experiments.tracking_experiment.TrackingExperiment
  resolution: 1024
  experiment_name: samara_controller
  video_path: data/visualize/samara_controller
